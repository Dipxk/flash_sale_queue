# fly.toml app configuration file generated for flash-sale-queue
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "flash-sale-queue"
primary_region = "iad"

[build]

[deploy]
  release_command = "bundle exec rails db:prepare"

[env]
  PORT = "8080"
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "true"
  RATE_LIMIT_PER_MINUTE = "6000"
  RESERVATION_TTL_SECONDS = "120"
  DISABLE_HOST_CHECK = "1"
  RAILS_MAX_THREADS = "5"

[processes]
  web = "./bin/rails server -b 0.0.0.0 -p 8080"
  worker = "bundle exec sidekiq -C config/sidekiq.yml"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["web"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
